name: Riemann Research CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TEXLIVE_INSTALL: scheme-small

jobs:

  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check src tests

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute tests
        run: |
          pytest -v

      - name: Generate coverage report
        run: |
          pip install pytest-cov
          pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  experiments:
    name: Reproducibility Checks
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run baseline experiment
        run: |
          python experiments/001_zeta_sanity/run.py

      - name: Verify generated results
        run: |
          test -f experiments/001_zeta_sanity/results.json

      - name: Upload experiment output
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/001_zeta_sanity/results.json

  latex:
    name: Build Paper
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Verify PDF generation
        run: |
          test -f paper/main.pdf

      - name: Upload paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: riemann-paper
          path: paper/main.pdf

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit || true

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs:
      - tests
      - latex
      - experiments

    steps:
      - name: Ready for publication
        run: |
          echo "All mandatory checks succeeded."